<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Chart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        thead {
            background-color: #c84242;
        }
        
        th {
            padding: 12px;
            text-align: center;
            color: white;
            font-weight: bold;
            border: 1px solid #999;
        }
        
        tbody tr {
            background-color: #f9f9f9;
        }
        
        tbody tr:hover {
            background-color: #f0f0f0;
        }
        
        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        td:first-child {
            text-align: left;
            font-weight: 600;
            color: #333;
            background-color: #fafafa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Size Chart</h1>
        
        <table>
            <thead>
                <tr>
                    <th>Part</th>
                    <th>XS</th>
                    <th>S</th>
                    <th>M</th>
                    <th>L</th>
                    <th>XL</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Waist</td>
                    <td>25</td>
                    <td>28</td>
                    <td>30</td>
                    <td>31</td>
                    <td>32</td>
                </tr>
                <tr>
                    <td>Chest</td>
                    <td>34</td>
                    <td>34</td>
                    <td>38</td>
                    <td>40</td>
                    <td>41</td>
                </tr>
                <tr>
                    <td>Sleeve</td>
                    <td>23</td>
                    <td>24</td>
                    <td>24</td>
                    <td>25</td>
                    <td>25</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
